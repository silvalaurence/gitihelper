<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 -16 560 160" role="img" aria-label="gitihelper" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- gitihelper: a friendly terminal. Monospace letters, a prompt, a cursor, and a little octopus peeking over the window. -->

  <!-- octopus peeking from behind the window (drawn first so the window covers its lower half) -->
  <g>
    <ellipse cx="486" cy="14" rx="24" ry="18" fill="#fb7185"/>
    <path d="M512 16C526 10 528 -4 518 -10" fill="none" stroke="#fb7185" stroke-width="7" stroke-linecap="round"/>
    <path d="M460 16C446 10 444 -2 452 -8" fill="none" stroke="#fb7185" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- terminal window -->
  <rect x="10" y="14" width="540" height="122" rx="18" fill="#0f172a"/>
  <circle cx="34" cy="30" r="4.5" fill="#fb7185"/>
  <circle cx="50" cy="30" r="4.5" fill="#fbbf24"/>
  <circle cx="66" cy="30" r="4.5" fill="#34d399"/>

  <!-- octopus eyes (on top of the window edge so they stay visible) -->
  <circle cx="477" cy="6" r="4.5" fill="#fff"/><circle cx="495" cy="6" r="4.5" fill="#fff"/>
  <circle cx="478" cy="7" r="2" fill="#0f172a"/><circle cx="496" cy="7" r="2" fill="#0f172a"/>

  <!-- prompt chevron -->
  <path d="M30 68L50 84L30 100" fill="none" stroke="#5eead4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- g i t i h e l p e r -->
  <g fill="none" stroke="#f1f5f9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- g -->
    <g transform="translate(76 40)"><ellipse cx="14" cy="42" rx="12" ry="19"/><path d="M26 22V72C26 82 18 86 8 84"/></g>
    <!-- i -->
    <g transform="translate(116 40)"><path d="M9 25H18V62"/><path d="M9 62H27"/><path d="M18 8h.1"/></g>
    <!-- t -->
    <g transform="translate(156 40)"><path d="M14 8V54C14 60 17 62 24 62"/><path d="M6 24H26"/></g>
    <!-- i -->
    <g transform="translate(196 40)"><path d="M9 25H18V62"/><path d="M9 62H27"/><path d="M18 8h.1"/></g>
    <!-- h -->
    <g transform="translate(236 40)"><path d="M6 0V62"/><path d="M6 36C6 24 26 24 26 36V62"/></g>
    <!-- e -->
    <path transform="translate(276 40)" d="M3 43H27C27 31 23 23 15 23C7 23 3 31 3 42C3 53 7 61 15 61C20 61 24 58 27 53"/>
    <!-- l -->
    <path transform="translate(316 40)" d="M9 4H18V58C18 61 20 62 25 62"/>
    <!-- p -->
    <g transform="translate(356 40)"><path d="M6 22V84"/><ellipse cx="18" cy="42" rx="12" ry="19"/></g>
    <!-- e -->
    <path transform="translate(396 40)" d="M3 43H27C27 31 23 23 15 23C7 23 3 31 3 42C3 53 7 61 15 61C20 61 24 58 27 53"/>
    <!-- r -->
    <g transform="translate(436 40)"><path d="M6 22V62"/><path d="M6 36C6 26 14 22 26 24"/></g>
  </g>

  <!-- blinking cursor -->
  <rect x="482" y="66" width="16" height="40" rx="2" fill="#5eead4"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
